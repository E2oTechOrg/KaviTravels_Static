    <div class="container mt-4">

      <!-- Bootstrap Pagination -->

        <ul class="pagination justify-content-center mt-4">
          <li class="page-item">

    <script>
      $(document).ready(function () {
        const totalImages = 85;
        const imagesPerPage = 20;
        let currentPage = 1;

        function loadImages(page) {
          $("#imageGallery").empty();
          const startIndex = (page - 1) * imagesPerPage + 1;
          const endIndex = Math.min(
            startIndex + imagesPerPage - 1,
            totalImages
          );

          for (let i = startIndex; i <= endIndex; i++) {
            const imgElement = `
                                    <img class="lazyload" 
                                         data-src="img/gallery/best-travels-madurai-kavi-travels-feedback-${i}.jpg.jpeg" 
                                         alt="Best Travels in Madurai - Kavi Travels Customer Feedback">
                                  `;
            $("#imageGallery").append(imgElement);
          }
        }

        function updatePagination() {
          $(".page-number").removeClass("active");
          $(".page-number[data-page='" + currentPage + "']").addClass("active");

          $("#prevPage").toggleClass("disabled", currentPage === 1);
          $("#nextPage").toggleClass(
            "disabled",
            currentPage * imagesPerPage >= totalImages
          );
        }

        $(".page-number").on("click", function (e) {
          e.preventDefault();
          currentPage = parseInt($(this).attr("data-page"));
          loadImages(currentPage);
          updatePagination();
        });

        $("#prevPage").on("click", function (e) {
          e.preventDefault();
          if (currentPage > 1) {
            currentPage--;
            loadImages(currentPage);
            updatePagination();
          }
        });

        $("#nextPage").on("click", function (e) {
          e.preventDefault();
          if (currentPage * imagesPerPage < totalImages) {
            currentPage++;
            loadImages(currentPage);
            updatePagination();
          }
        });

        // Initial Load
        loadImages(currentPage);
        updatePagination();
      });
    </script>

    <script>
      let currentIndex = 0;
      const images = document.querySelectorAll(".gallery img");
      const overlay = document.getElementById("overlay");
      const fullImage = document.getElementById("fullImage");

      images.forEach((img, index) => {
        img.addEventListener("click", () => {
          currentIndex = index;
          showImage();
        });
      });

      function showImage() {
        fullImage.src = images[currentIndex].src;
        overlay.style.display = "flex";
      }

      function closeOverlay() {
        overlay.style.display = "none";
      }

      function prevImage() {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        showImage();
      }

      function nextImage() {
        currentIndex = (currentIndex + 1) % images.length;
        showImage();
      }
    </script>

    <!-- Fresco.js -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const images = document.querySelectorAll("img[data-src]");

        if ("IntersectionObserver" in window) {
          let imgObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                let img = entry.target;
                img.src = img.getAttribute("data-src");
                img.removeAttribute("data-src");
                observer.unobserve(img);
              }
            });
          });

          images.forEach((img) => {
            imgObserver.observe(img);
          });
        } else {
          // Fallback for old browsers
          images.forEach((img) => {
            img.src = img.getAttribute("data-src");
            img.removeAttribute("data-src");
          });
        }
      });
    </script>
    <script>
      const gallery = document.querySelector(".gallery");

        );
        img.classList.add("lazy-load");
        gallery.appendChild(img);
